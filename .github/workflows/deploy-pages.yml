name: Build and publish Muse storefront

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Export the storefront for GitHub Pages
        env:
          STATIC_EXPORT: "true"
          NEXT_PUBLIC_BASE_PATH: /muse-site-study
          NEXT_PUBLIC_STORE_API_BASE_URL: https://api.musetoken.store
        run: npm run build:store
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
